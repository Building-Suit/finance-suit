name: work_tracker
description: "Finance Suit — private salary, work, and cash-flow control."
publish_to: 'none'
version: 0.22.0+41

environment:
  sdk: ^3.11.4

dependencies:
  app_links: ^7.0.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  hugeicons: ^1.1.7
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.5.0
  in_app_update: ^4.2.5
  intl: 0.20.2
  json_annotation: ^4.12.0
  local_auth: ^3.0.2
  meta: ^1.17.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.16.0

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  mocktail: ^1.0.5
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/legal/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
