name: Branch and version policy

on:
  pull_request:
    branches:
      - dev
      - stg
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
  push:
    branches:
      - dev
      - stg
      - main

permissions:
  contents: write

jobs:
  policy:
    name: Validate branch flow and release version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          # A same-repository dev PR is checked out at its head so the
          # guarded version synchronizer can commit directly to that branch.
          # Fork PRs remain read-only and continue through normal validation.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'dev' && github.head_ref || github.sha }}

      - name: Fetch branch baselines
        run: |
          git fetch --no-tags origin \
            main:refs/remotes/origin/main \
            stg:refs/remotes/origin/stg \
            dev:refs/remotes/origin/dev

      - name: Validate pull-request route and title
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          case "${BASE_BRANCH}" in
            dev)
              if [[ "${HEAD_BRANCH}" == "dev" ||
                    "${HEAD_BRANCH}" == "stg" ||
                    "${HEAD_BRANCH}" == "main" ]]; then
                echo "dev accepts only feature/fix branches." >&2
                exit 1
              fi
              ;;
            stg)
              [[ "${HEAD_BRANCH}" == "dev" ]] || {
                echo "Only dev may be promoted into stg." >&2
                exit 1
              }
              ;;
            main)
              [[ "${HEAD_BRANCH}" == "stg" ]] || {
                echo "Only stg may be promoted into main." >&2
                exit 1
              }
              ;;
          esac

          # The dev PR title is the release-impact signal and becomes the
          # squash commit summary. Promotion PRs preserve the version already
          # decided on dev, so they only receive a monotonicity check below.
          if [[ "${BASE_BRANCH}" == "dev" ]] && [[ ! "${PR_TITLE}" =~ ^(feat|fix|perf|refactor|docs|test|ci|build|chore)(\([a-z0-9_-]+\))?(!)?:\ .+ ]]; then
            echo "Use a Conventional Commit PR title so version impact is explicit." >&2
            echo "Example: feat(finance): add recurring income" >&2
            exit 1
          fi

      - name: Synchronize version for trusted dev pull requests
        if: github.event_name == 'pull_request' && github.base_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          bash ./tool/sync_release_version.sh origin/dev "${PR_TITLE}"
          if git diff --quiet -- pubspec.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore(release): synchronize app version"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Test version policy
        shell: bash
        run: ./tool/test_release_version_policy.sh

      - name: Calculate and enforce release impact
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ "${BASE_BRANCH}" == "dev" ]]; then
              ./tool/check_release_version.sh origin/dev check "${PR_TITLE}"
            else
              ./tool/check_release_version.sh "origin/${BASE_BRANCH}" promote
            fi
          elif [[ "${CURRENT_BRANCH}" == "dev" ]]; then
            ./tool/check_release_version.sh "${BEFORE_SHA}" check
          else
            ./tool/check_release_version.sh "${BEFORE_SHA}" promote
          fi

      - name: Validate bilingual Play release notes
        shell: bash
        run: ./tool/check_play_release_notes.sh origin/main check
