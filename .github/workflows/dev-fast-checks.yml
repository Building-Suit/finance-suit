name: Finance Suit fast checks

on:
  pull_request:
    branches:
      - dev
    paths:
      - android/**
      - assets/**
      - ios/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/dev-fast-checks.yml
  push:
    branches:
      - dev
    paths:
      - android/**
      - assets/**
      - ios/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/dev-fast-checks.yml

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  flutter:
    name: Format, analyze, and test Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Flutter and dependency cache
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub
