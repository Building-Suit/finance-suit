name: Finance Suit Supabase deployment

on:
  workflow_call:
    inputs:
      release-sync:
        description: Set by the release pipeline to run without manual confirmation.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to back up, migrate, verify, and deploy.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-finance-suit-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Backup, migrate, verify, and deploy
    # `workflow_call` never surfaces as github.event_name (the caller's event
    # does), so the release pipeline must opt in via the release-sync input.
    if: >-
      inputs.release-sync == true ||
      inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: kedjrbwnznvfqlzszawa
      SUPABASE_CLI_VERSION: 2.113.0

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Validate release branch and secrets
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            stg | main) ;;
            *)
              echo "Supabase deployment is allowed only from stg or main." >&2
              exit 1
              ;;
          esac
          [[ -n "${SUPABASE_ACCESS_TOKEN}" ]] || {
            echo "Missing SUPABASE_ACCESS_TOKEN secret." >&2
            exit 1
          }
          [[ -n "${SUPABASE_DB_PASSWORD}" ]] || {
            echo "Missing SUPABASE_DB_PASSWORD secret." >&2
            exit 1
          }

      - name: Link Finance Suit project
        run: >-
          npx --yes supabase@${SUPABASE_CLI_VERSION} link
          --project-ref "${SUPABASE_PROJECT_REF}"
          --password "${SUPABASE_DB_PASSWORD}"

      - name: Record migration state before deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx --yes supabase@${SUPABASE_CLI_VERSION} migration list --linked; then
              exit 0
            fi
            if [[ "${attempt}" == 3 ]]; then
              echo "Unable to connect to Postgres after 3 attempts." >&2
              exit 1
            fi
            sleep "$((attempt * 10))"
          done

      - name: Create pre-migration backups
        shell: bash
        run: |
          set -euo pipefail
          backup_dir="${RUNNER_TEMP}/finance-suit-supabase-backup"
          mkdir -p "${backup_dir}"
          npx --yes supabase@${SUPABASE_CLI_VERSION} db dump --linked \
            --password "${SUPABASE_DB_PASSWORD}" \
            --file "${backup_dir}/backup_pre_sync.sql"
          npx --yes supabase@${SUPABASE_CLI_VERSION} db dump --linked \
            --password "${SUPABASE_DB_PASSWORD}" \
            --data-only --use-copy \
            --file "${backup_dir}/backup_pre_sync_data.sql"
          sha256sum "${backup_dir}"/*.sql > "${backup_dir}/SHA256SUMS"

      - name: Retain pre-migration backups
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: finance-suit-supabase-${{ github.ref_name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/finance-suit-supabase-backup
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Preview and apply pending migrations
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@${SUPABASE_CLI_VERSION} db push --linked --dry-run
          npx --yes supabase@${SUPABASE_CLI_VERSION} db push --linked

      - name: Verify migration state and schema
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx --yes supabase@${SUPABASE_CLI_VERSION} migration list --linked; then
              break
            fi
            if [[ "${attempt}" == 3 ]]; then
              echo "Unable to connect to Postgres after 3 attempts." >&2
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
          npx --yes supabase@${SUPABASE_CLI_VERSION} db push --linked --dry-run
          npx --yes supabase@${SUPABASE_CLI_VERSION} db query --linked \
            --file supabase/verification/production.sql

      - name: Deploy changed or missing Edge Functions
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          mapfile -t local_functions < <(
            find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_shared' -printf '%f\n' | sort
          )

          if (( ${#local_functions[@]} == 0 )); then
            echo "No local Edge Functions found; skipping deployment."
            exit 0
          fi

          remote_json="${RUNNER_TEMP}/supabase-functions.json"
          .github/scripts/retry-supabase-command.sh \
            "${remote_json}" \
            "List deployed Edge Functions" \
            npx --yes supabase@${SUPABASE_CLI_VERSION} functions list \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --output json

          mapfile -t remote_functions < <(
            python3 - "${remote_json}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              data = json.load(handle)
          for item in data:
              slug = item.get("slug") or item.get("name")
              if slug:
                  print(slug)
          PY
          )

          deploy_file="${RUNNER_TEMP}/edge-functions-to-deploy"
          : > "${deploy_file}"

          add_function() {
            local function_name="$1"
            grep -Fxq "${function_name}" "${deploy_file}" || echo "${function_name}" >> "${deploy_file}"
          }

          for function_name in "${local_functions[@]}"; do
            if ! printf '%s\n' "${remote_functions[@]}" | grep -Fxq "${function_name}"; then
              echo "Will deploy new Edge Function: ${function_name}"
              add_function "${function_name}"
            fi
          done

          diff_range=""
          zero_sha="0000000000000000000000000000000000000000"
          if [[ -n "${BEFORE_SHA:-}" &&
                "${BEFORE_SHA}" != "${zero_sha}" &&
                "$(git cat-file -t "${BEFORE_SHA}" 2>/dev/null || true)" == "commit" ]]; then
            diff_range="${BEFORE_SHA}...HEAD"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            diff_range="HEAD^...HEAD"
          fi

          if [[ -n "${diff_range}" ]]; then
            while IFS= read -r changed_path; do
              case "${changed_path}" in
                supabase/functions/_shared/*)
                  # Shared modules are bundled into each function. Redeploy all
                  # deployable functions, but never attempt to deploy _shared.
                  for function_name in "${local_functions[@]}"; do
                    add_function "${function_name}"
                  done
                  ;;
                supabase/functions/*/*)
                  function_name="${changed_path#supabase/functions/}"
                  function_name="${function_name%%/*}"
                  add_function "${function_name}"
                  ;;
                supabase/config.toml)
                  for function_name in "${local_functions[@]}"; do
                    add_function "${function_name}"
                  done
                  ;;
              esac
            done < <(git diff --name-only "${diff_range}")
          else
            echo "No comparable previous commit found; deploying all local Edge Functions."
            for function_name in "${local_functions[@]}"; do
              add_function "${function_name}"
            done
          fi

          if [[ ! -s "${deploy_file}" ]]; then
            echo "No new or changed Edge Functions; skipping deployment."
            exit 0
          fi

          while IFS= read -r function_name; do
            mapfile -t deploy_args < <(
              python3 - "${function_name}" <<'PY'
          import sys
          import tomllib

          with open("supabase/config.toml", "rb") as handle:
              config = tomllib.load(handle)

          function_config = config.get("functions", {}).get(sys.argv[1], {})
          if function_config.get("verify_jwt") is False:
              print("--no-verify-jwt")
          PY
            )

            echo "Deploying Edge Function: ${function_name}"
            .github/scripts/retry-supabase-command.sh \
              - \
              "Deploy Edge Function ${function_name}" \
              npx --yes supabase@${SUPABASE_CLI_VERSION} functions deploy "${function_name}" \
              --project-ref "${SUPABASE_PROJECT_REF}" \
              --use-api \
              "${deploy_args[@]}"
          done < "${deploy_file}"
