name: Deploy Finance Suit account deletion

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to apply the migration and Edge Function.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-finance-suit-deletion-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy migration and Edge Function
    if: inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: kedjrbwnznvfqlzszawa

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SUPABASE_ACCESS_TOKEN}" ]] || {
            echo "Missing SUPABASE_ACCESS_TOKEN repository secret." >&2
            exit 1
          }
          [[ -n "${SUPABASE_DB_PASSWORD}" ]] || {
            echo "Missing SUPABASE_DB_PASSWORD repository secret." >&2
            exit 1
          }

      - name: Link Supabase project
        run: >-
          npx --yes supabase@2.109.1 link
          --project-ref "${SUPABASE_PROJECT_REF}"
          --password "${SUPABASE_DB_PASSWORD}"

      - name: Preview pending migrations
        run: npx --yes supabase@2.109.1 db push --linked --dry-run

      - name: Apply pending migrations
        run: npx --yes supabase@2.109.1 db push --linked

      - name: Deploy delete-account Edge Function
        run: >-
          npx --yes supabase@2.109.1 functions deploy delete-account
          --project-ref "${SUPABASE_PROJECT_REF}"
          --no-verify-jwt
          --use-api
