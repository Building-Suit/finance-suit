name: Android APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create or update. Leave blank to use apk-<run>-<sha>.'
        required: false
        type: string
      prerelease:
        description: 'Mark the GitHub release as a prerelease.'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.41.6'
  APP_ENVIRONMENT: production
  AUTH_CALLBACK_SCHEME: worktracker
  AUTH_CALLBACK_HOST: auth-callback

jobs:
  build-release-apk:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve release tag
        shell: bash
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          elif [[ -n "${REQUESTED_RELEASE_TAG}" ]]; then
            release_tag="${REQUESTED_RELEASE_TAG}"
          else
            release_tag="apk-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          fi

          if [[ ! "${release_tag}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid release tag: ${release_tag}" >&2
            exit 1
          fi

          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"
          echo "APK_NAME=work-tracker-${release_tag}.apk" >> "${GITHUB_ENV}"

      - name: Validate required Supabase secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          missing=()
          [[ -n "${SUPABASE_URL}" ]] || missing+=("SUPABASE_URL")
          [[ -n "${SUPABASE_ANON_KEY}" ]] || missing+=("SUPABASE_ANON_KEY")

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          # Derive versionName from the release tag (v0.1.4 -> 0.1.4) and
          # versionCode from the unique run number, so every published APK
          # reports which build it is and upgrades install cleanly.
          build_name="${RELEASE_TAG#v}"
          if [[ ! "${build_name}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            build_name="0.0.0-${build_name}"
          fi

          flutter build apk --release \
            --build-name="${build_name}" \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define=APP_VERSION="${build_name}+${GITHUB_RUN_NUMBER}" \
            --dart-define=SUPABASE_URL="${SUPABASE_URL}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}" \
            --dart-define=APP_ENVIRONMENT="${APP_ENVIRONMENT}" \
            --dart-define=AUTH_CALLBACK_SCHEME="${AUTH_CALLBACK_SCHEME}" \
            --dart-define=AUTH_CALLBACK_HOST="${AUTH_CALLBACK_HOST}"

          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/${APK_NAME}"
          sha256sum "release/${APK_NAME}" > "release/${APK_NAME}.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: |
            release/${{ env.APK_NAME }}
            release/${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Ensure release tag exists
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            exit 0
          fi

          git tag "${RELEASE_TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          prerelease_flag=()
          if [[ "${GITHUB_REF_TYPE}" != "tag" && "${PRERELEASE}" == "true" ]]; then
            prerelease_flag+=(--prerelease)
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              "release/${APK_NAME}" \
              "release/${APK_NAME}.sha256" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "release/${APK_NAME}" \
              "release/${APK_NAME}.sha256" \
              --title "Work Tracker ${RELEASE_TAG}" \
              --notes "Production Android APK built from ${GITHUB_SHA}." \
              "${prerelease_flag[@]}"
          fi
